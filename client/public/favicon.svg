  <path d="M32 25 L32 37" stroke="#0B6B63" stroke-width="1.5" stroke-linecap="round" />

  <!-- Knowledge Sunburst Rays -->
  <circle cx="32" cy="18" r="3" fill="url(#wuGold)" />
  <line x1="32" y1="13" x2="32" y2="11" stroke="url(#wuGold)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="36" y1="15" x2="38" y2="13" stroke="url(#wuGold)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="28" y1="15" x2="26" y2="13" stroke="url(#wuGold)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Document & Archive Ribbon Scroll Base -->
  <path d="M22 42 Q32 46 42 42" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <path d="M26 46 Q32 49 38 46" fill="none" stroke="url(#wuGold)" stroke-width="1.5" stroke-linecap="round" />
