<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Wollo University Institutional Colors -->
    <linearGradient id="wuShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6B63" />
      <stop offset="100%" stop-color="#074E48" />
    </linearGradient>
    <linearGradient id="wuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B144" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Contour -->
  <path d="M32 4 L56 12 C56 36 46 52 32 60 C18 52 8 36 8 12 Z" fill="url(#wuShield)" stroke="#DCE4EC" stroke-width="1.5" />

  <!-- Inner Gold Inset -->
